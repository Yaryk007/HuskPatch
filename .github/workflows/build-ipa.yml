name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Host tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu bison flex gettext cmake e2fsprogs || true
          # virglrenderer's meson build imports yaml from Homebrew's python3.
          /opt/homebrew/bin/python3 -m pip install --break-system-packages --user pyyaml mako packaging
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          # build_gpu_ios.sh calls meson and ninja by their Apple-silicon Homebrew path.
          ls /opt/homebrew/bin/meson /opt/homebrew/bin/ninja
          # build_rppairing_ios.sh (built-in StikJIT pairing) is Rust.
          rustup target add aarch64-apple-ios

      # ANGLE, MoltenVK and the dependency stack take most of the build time
      # and only change when the build scripts or pins do, so they are cached.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/sources
            third_party/gpu
            build/ios-arm64/sysroot
            build/ios-arm64/lib/MoltenVK.xcframework
          key: deps-v2-${{ runner.os }}-${{ hashFiles('scripts/sources.sh', 'scripts/build_ios.sh', 'scripts/build_angle_ios.sh', 'scripts/build_gpu_ios.sh', 'scripts/build_moltenvk_ios.sh', 'patches/**') }}

      # Husk's Java runtime (java-runtime) and the Android system files Flutter apps read (android-system) are built
      # by Leviidev from the LineageOS image on his own Mac, so they cannot be built here. Without them Java apps do not
      # start. This takes both from the official release the code matches.
      - name: Java runtime and Android system files from the official release
        env:
          GH_TOKEN: ${{ github.token }}
          HUSK_RUNTIME_TAG: "2.0"
        run: |
          gh release download "$HUSK_RUNTIME_TAG" -R Leviidev/Husk -p Husk.ipa -D "$RUNNER_TEMP"
          mkdir -p build "$RUNNER_TEMP/official"
          unzip -q "$RUNNER_TEMP/Husk.ipa" "Payload/Husk.app/java-runtime/*" "Payload/Husk.app/android-system/*" -d "$RUNNER_TEMP/official"
          rm -rf build/java-runtime build/android-system
          cp -R "$RUNNER_TEMP/official/Payload/Husk.app/java-runtime" build/java-runtime
          cp -R "$RUNNER_TEMP/official/Payload/Husk.app/android-system" build/android-system
          test -f build/java-runtime/husk-framework.dex
          du -sh build/java-runtime build/android-system

      # Husk's own Java framework (husk-framework.dex) is source in this repo, so it is built here rather than taken from
      # the release: HuskPatch changes it (Material You colours, husk/DynamicColors.java).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Husk's Java framework
        run: |
          curl -fsSL -o "$RUNNER_TEMP/r8.jar" https://dl.google.com/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar
          HUSK_JDK="$JAVA_HOME" HUSK_D8="$RUNNER_TEMP/r8.jar" ./src/java-framework/build.sh "$PWD/build/java-runtime/husk-framework.dex"
          ls -la build/java-runtime/husk-framework.dex

      - name: Build
        run: ./scripts/ci_build.sh "$PWD/build/Husk.ipa"

      - name: Check the IPA carries the Java runtime
        run: |
          n=$(unzip -l build/Husk.ipa | grep -c "Payload/Husk.app/java-runtime/") || true
          echo "java-runtime files in the IPA: $n"
          test "$n" -gt 10

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: |
            build/Husk.ipa
            build/Husk.tipa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
